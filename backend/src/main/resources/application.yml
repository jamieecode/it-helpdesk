spring:
  datasource:
    url: jdbc:mysql://localhost:3307/helpdesk?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:helpdesk}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul

mybatis:
  configuration:
    map-underscore-to-camel-case: true
